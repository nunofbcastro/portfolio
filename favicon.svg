<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    :root { --c1: #4eaeb3; --c2: #004e52; --accent: white; }
    @media (prefers-color-scheme: dark) {
      :root { --c1: #5eead4; --c2: #0f766e; --accent: #f8fafc; }
    }
  </style>
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:var(--c1);stop-opacity:1" />
      <stop offset="100%" style="stop-color:var(--c2);stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" />
      <feOffset dx="0.5" dy="0.5" result="offsetblur" />
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#gradient)" />
  <g filter="url(#shadow)">
    <path d="M9 16L13 12M9 16L13 20" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M23 16L19 12M23 16L19 20" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M17 9L15 23" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
